<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32.png">
    <link rel="apple-touch-icon" href="./images/apple-touch-icon.png">
    <link rel="stylesheet" href="./css/vendor/flatpickr.min.css">
    <link rel="stylesheet" href="./css/style.css"/>
    <link rel="stylesheet" href="./css/components.css">
    <title>Journey — Trip Planner</title>
</head>
<body>
  <!-- COMMON: navigation bar -->
  <div id="nav-placeholder"></div>

  <main class="wrap">
    <h1 class="page-title">Plan your journey</h1>
    <p class="hint" id="pick-hint"></p>

    <section class="card">
      <h2>Trip Period</h2>
      <div class="trip-dates">
        <label>Start date <input type="text" id="trip-start" placeholder="dd/mm/yyyy" autocomplete="off"></label>
        <label>End date <input type="text" id="trip-end" placeholder="dd/mm/yyyy" autocomplete="off"></label>
      </div>
      <p id="trip-hint" class="hint"></p>

      <div id="day-tabs" class="day-tabs"></div>
      <div id="day-fields"></div>
      <p id="draft-cost" class="draft-cost"></p>
    </section>
  </main>

  <!-- COMMON: Page navigation -->
  <div id="pagination-placeholder"></div>

  <!-- COMMON: Footer -->
  <div id="footer-placeholder"></div>

  <script src="./js/data.js"></script>
  <script src="./js/script.js"></script>
  <script src="./js/vendor/flatpickr.min.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/journey.js"></script>
</body>
</html>
